<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="610" viewBox="0 0 1100 610" role="img" aria-label="木質五子棋棋盤局部">
<defs>
  <linearGradient id="air" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#f1f0e7"/><stop offset=".55" stop-color="#becfd0"/><stop offset="1" stop-color="#a6bdc0"/></linearGradient>
  <linearGradient id="wood" x1=".1" y1="0" x2="1" y2="1"><stop stop-color="#e8cba1"/><stop offset=".25" stop-color="#f3d8ad"/><stop offset=".58" stop-color="#c99e70"/><stop offset="1" stop-color="#986b43"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#8d633d"/><stop offset=".26" stop-color="#a77a50"/><stop offset="1" stop-color="#3f3024"/></linearGradient>
  <linearGradient id="boardLighting" x1="0" y1="0" x2="1" y2=".8"><stop stop-color="#fff3d7" stop-opacity=".38"/><stop offset=".48" stop-color="#ffffff" stop-opacity="0"/><stop offset="1" stop-color="#402e1b" stop-opacity=".24"/></linearGradient>
  <radialGradient id="mist" cx=".5" cy=".5" r=".65"><stop stop-color="#fffdf5" stop-opacity=".68"/><stop offset="1" stop-color="#fffdf5" stop-opacity="0"/></radialGradient>
  <filter id="softBlur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  <filter id="woodGrain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency=".016 .32" numOctaves="3" seed="8" stitchTiles="stitch" result="grain"/>
    <feColorMatrix in="grain" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="subtle"><feFuncA type="linear" slope=".15"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="subtle" mode="multiply"/>
  </filter>
  <pattern id="lines" width="37" height="37" patternUnits="userSpaceOnUse"><path d="M0 0H37M0 0V37" stroke="#493b2c" stroke-opacity=".78" stroke-width="1.35" fill="none"/></pattern>
  <clipPath id="boardClip"><path d="M0 0H960V580H0Z"/></clipPath>
</defs>
