<ellipse cx="250" cy="245" rx="400" ry="260" fill="url(#mist)"/>
<g transform="translate(358,-177) rotate(15)">
  <rect x="31" y="57" width="960" height="580" rx="15" fill="#24333b" opacity=".32" filter="url(#softBlur)"/>
  <path d="M-14 12Q-14 -17 16 -17H965Q984 -17 984 5V598Q984 620 959 620H23Q-14 620 -14 585Z" fill="#67452f"/>
  <rect x="-3" y="-5" width="975" height="592" rx="11" fill="#a9794e"/>
  <rect x="0" y="0" width="960" height="580" rx="7" fill="url(#wood)"/>
  <g clip-path="url(#boardClip)">
    <rect x="0" y="0" width="960" height="580" fill="#c49d72" opacity=".22" filter="url(#woodGrain)"/>
    <path d="M0 65C230 88 475 27 960 82M0 154C340 185 565 103 960 158M0 295C250 333 520 264 960 306M0 437C290 470 620 401 960 452" stroke="#fff5dc" stroke-width="7" opacity=".16" fill="none"/>
    <rect x="48" y="40" width="864" height="502" fill="url(#lines)"/>
    <rect x="48" y="40" width="864" height="502" stroke="#544532" stroke-width="1.5" stroke-opacity=".7" fill="none"/>
    <circle cx="344" cy="262" r="3.5" fill="#524130"/><circle cx="566" cy="262" r="3.5" fill="#524130"/>
    <rect width="960" height="580" fill="url(#boardLighting)"/>
