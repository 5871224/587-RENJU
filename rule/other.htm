  <h2>其他玩法</h2>
  <hr />

  <b>抓子</b><br />
  棋力相當時如何決定誰拿黑子呢？其方法和圍棋略有差別，雙方各抓一把棋子，相加總和是偶數便交換棋子，奇數則不換。<br />
  <br />
  <b>聯棋</b><br />
  黑白雙方各二人或數人輪流落子。<br />
  <br />
  <b>一色棋</b><br />
  只用一種顏色的棋子來下雙方的棋，靠記憶來辨別黑白雙方。<br />
  <br />
  <b>混色棋</b><br />
  將黑白棋子混在一起，雙方隨機拿子下棋，盤面雖上有黑白，但黑子可能代表黑子或白子，白子也是如此，更增加記憶難度。<br />
  <br />
  <b>盲棋</b><br />
  完全不看棋盤棋子，靠聽及唸座標來下棋，大概是下棋的最高境界了吧。
