<!DOCTYPE HTML>
<html>

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>規則</title>
	<link href="renju.css" rel="stylesheet" type="text/css">
	<script src="https://587.renju.org.tw/js/jquery-3.7.1.min.js"></script>
	<script type="text/javascript">
		$(document).ready(function () {
			// 載入主選單
			htmlobj = $.ajax({
				url: "https://587.renju.org.tw/menu.html",
				async: false
			});
			$("#myDiv").html(htmlobj.responseText);

			// 預設載入行棋規則
			loadRuleOptions();
		});

        function loadRuleOptions() {
            $.ajax({
                url: 'api/site-content.php',
                data: { kind: 'rules' },
                dataType: 'json',
                cache: false,
                success: function (data) {
                    if (!Array.isArray(data.rules)) {
                        loadContent('rule/rulehome.htm');
                        return;
                    }
                    const selector = document.getElementById('rule-select');
                    selector.replaceChildren();
                    data.rules.forEach(function (rule) {
                        if (!/^[a-z0-9-]{1,80}$/.test(String(rule.slug || ''))) return;
                        const option = document.createElement('option');
                        option.value = 'rule/' + rule.slug + '.htm';
                        option.textContent = rule.title || rule.slug;
                        selector.appendChild(option);
                    });
                    if (selector.options.length) {
                        loadContent(selector.value);
                    } else {
                        document.getElementById('contentBody').textContent = '目前沒有公開的規則內容。';
                    }
                },
                error: function () {
                    loadContent('rule/rulehome.htm');
                }
            });
        }

        function renderRuleContent(html) {
            $('#contentBody').html(html);
            window.scrollTo(0, 0);
        }

        function loadStaticRule(url) {
            // 資料庫故障時，原有四份 HTML 仍可正常顯示。
            if (!/^rule\/(?:rulehome|renju-rule|gomoku-rule|other)\.htm$/.test(url)) {
                $('#contentBody').text('規則內容暫時無法讀取。');
                return;
            }
            $.ajax({
                url: url,
                success: function (data) {
                    var bodyContent = data.match(/<body[^>]*>([\s\S.]*)<\/body>/i);
                    var content = bodyContent ? bodyContent[1] : data;
                    var div = document.createElement('div');
                    div.innerHTML = content;
                    $(div).find('#myDiv').remove();
                    renderRuleContent(div.innerHTML);
                },
                error: function () {
                    $('#contentBody').text('規則內容暫時無法讀取。');
                }
            });
        }

        function loadContent(url) {
            if (!url) return;
            const match = /^rule\/([a-z0-9-]{1,80})\.htm$/.exec(url);
            if (!match) return;
            $.ajax({
                url: 'api/site-content.php',
                data: { kind: 'rules', slug: match[1] },
                dataType: 'json',
                cache: false,
                success: function (data) {
                    if (typeof data.body_html === 'string') {
                        renderRuleContent(data.body_html);
                    } else {
                        loadStaticRule(url);
                    }
                },
                error: function () {
                    loadStaticRule(url);
                }
            });
        }

	</script>
</head>

<body>
	<div id="myDiv"></div>
	<div>
		<h1>規則</h1>
		<hr>

		<div class="rule-selector-container site-panel site-panel--center">
			<label for="rule-select" class="form-label">選擇規則分類：</label>
			<select id="rule-select" class="rule-selector" onchange="loadContent(this.value)">
				<option value="rule/rulehome.htm">行棋規則</option>
				<option value="rule/renju-rule.htm">禁手開局規則</option>
				<option value="rule/gomoku-rule.htm">無禁開局規則</option>
				<option value="rule/other.htm">其他玩法</option>
			</select>
		</div>

		<div id="contentBody">
			<!-- 動態加載內容 -->
		</div>
	</div>
</body>

</html>
