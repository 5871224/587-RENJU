<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>規則｜台灣連珠</title>
    <link href="renju.css" rel="stylesheet" type="text/css">
    <link href="rule-tree.css?v=20261024a" rel="stylesheet" type="text/css">
    <script src="js/jquery-3.7.1.min.js"></script>
    <script>
        $(function () {
            $.ajax({url:'menu.html',async:false}).done(function (menu) {
                $('#myDiv').html(menu);
            });
        });
    </script>
    <script src="rule-tree.js?v=20261024a" defer></script>
</head>
<body>
    <div id="myDiv"></div>
    <main>
        <h1>規則</h1>
        <hr>
        <p class="rule-tree-intro">選取左側行棋規則，可查看右側對應的開局規則；點擊任一規則即可展開或收合詳細內容。</p>
        <p class="rule-tree-state" id="rule-tree-state" role="status">正在載入規則資料……</p>
        <div class="rule-tree-layout" id="rule-tree-layout" hidden>
            <section class="rule-tree-panel rule-tree-panel--roots" aria-labelledby="rule-first-title">
                <div class="rule-tree-heading">
                    <span class="rule-tree-kicker">第一層</span>
                    <h2 id="rule-first-title">行棋規則</h2>
                </div>
                <div class="rule-tree-list" id="rule-tree-roots"></div>
            </section>
            <section class="rule-tree-panel rule-tree-panel--children" aria-labelledby="rule-second-title">
                <div class="rule-tree-heading">
                    <span class="rule-tree-kicker">第二層</span>
                    <h2 id="rule-second-title">開局規則</h2>
                </div>
                <p class="rule-tree-subheading" id="rule-tree-selected"></p>
                <div class="rule-tree-list" id="rule-tree-children"></div>
            </section>
        </div>
        <noscript>此頁的樹狀展開功能需要 JavaScript。你仍可查看 <a href="rule/rulehome.htm">原始行棋規則</a>。</noscript>
    </main>
</body>
</html>
