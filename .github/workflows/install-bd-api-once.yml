name: Install BD API once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-bd-api-once.yml'

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Copy API into BD and switch frontend paths
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          import ftplib, io, os, re
          def clean(v): return (v or '').strip('\r\n ').strip()
          ftp=ftplib.FTP_TLS(); ftp.connect(clean(os.environ['FTP_SERVER']),21,timeout=60)
          ftp.login(clean(os.environ['FTP_USERNAME']),clean(os.environ['FTP_PASSWORD'])); ftp.prot_p()
          base=clean(os.environ.get('FTP_SERVER_DIR','')).replace('\\','/')
          if base.startswith('/'): ftp.cwd('/')
          for part in base.strip('/').split('/'):
              if part: ftp.cwd(part)
          root=ftp.pwd()
          def read(path):
              data=bytearray(); ftp.retrbinary('RETR '+path,data.extend); return data.decode('utf-8')
          def write(path,text): ftp.storbinary('STOR '+path,io.BytesIO(text.encode('utf-8')))
          ftp.cwd(root+'/BD')
          try: ftp.mkd('api')
          except ftplib.error_perm: pass
          ftp.cwd(root)

          yxdb=read(root+'/vcf/yxdb.php')
          yxdb=yxdb.replace("dirname(__DIR__) . '/riftw/login.php'", "dirname(__DIR__, 2) . '/riftw/login.php'")
          yxdb=yxdb.replace("dirname(__DIR__) . '/Sched/api/config.php'", "dirname(__DIR__, 2) . '/Sched/api/config.php'")
          if "dirname(__DIR__, 2) . '/riftw/login.php'" not in yxdb: raise RuntimeError('yxdb path patch failed')
          write(root+'/BD/api/yxdb.php',yxdb)

          google=read(root+'/vcf/google-login.php')
          google=google.replace("const targetOrigin = 'https://5871224.github.io';", "const targetOrigin = window.location.origin;")
          if 'const targetOrigin = window.location.origin;' not in google: raise RuntimeError('google origin patch failed')
          write(root+'/BD/api/google-login.php',google)

          cloud=read(root+'/BD/rapfi/vcf-lz4-cloud.js')
          cloud=cloud.replace('const API_URL = "https://587.renju.org.tw/vcf/yxdb.php";', 'const API_URL = "api/yxdb.php";')
          if 'const API_URL = "api/yxdb.php";' not in cloud: raise RuntimeError('cloud path patch failed')
          write(root+'/BD/rapfi/vcf-lz4-cloud.js',cloud)

          auth=read(root+'/BD/rapfi/vcf-google-popup-auth.js')
          auth=auth.replace('const LOGIN_URL = "https://587.renju.org.tw/vcf/google-login.php";', 'const LOGIN_URL = "api/google-login.php";')
          auth=auth.replace('const LOGIN_ORIGIN = "https://587.renju.org.tw";', 'const LOGIN_ORIGIN = global.location.origin;')
          if 'const LOGIN_URL = "api/google-login.php";' not in auth: raise RuntimeError('auth path patch failed')
          write(root+'/BD/rapfi/vcf-google-popup-auth.js',auth)

          index=read(root+'/BD/index.html')
          index=re.sub(r'rapfi/vcf-lz4-cloud\.js(?:\?v=[^"\']*)?', 'rapfi/vcf-lz4-cloud.js?v=20260914-bd-api', index)
          index=re.sub(r'rapfi/vcf-google-popup-auth\.js(?:\?v=[^"\']*)?', 'rapfi/vcf-google-popup-auth.js?v=20260914-bd-api', index)
          write(root+'/BD/index.html',index)
          ftp.quit()

      - name: Verify new BD API
        shell: bash
        run: |
          set -euo pipefail
          curl -k -fsS --max-time 30 'https://587.renju.org.tw/BD/api/yxdb.php?action=public_config' | grep -q '"ok":true'
          test "$(curl -k -sS -o /dev/null -w '%{http_code}' --max-time 30 'https://587.renju.org.tw/BD/api/google-login.php')" = '200'
          curl -k -fsS --max-time 30 'https://587.renju.org.tw/BD/rapfi/vcf-lz4-cloud.js' | grep -q 'const API_URL = "api/yxdb.php";'
          curl -k -fsS --max-time 30 'https://587.renju.org.tw/BD/' | grep -q '20260914-bd-api'
