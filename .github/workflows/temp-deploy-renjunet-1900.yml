name: Temp deploy RenjuNet 1900 fallback

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-deploy-renjunet-1900.yml'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Validate PHP
        shell: bash
        run: php -l rank/lib/rating.php && php -l rank/recalculate.php
      - name: Upload files
        shell: python
        run: |
          import ftplib, os, posixpath
          server=os.environ['FTP_SERVER'].strip()
          user=os.environ['FTP_USERNAME'].strip()
          password=os.environ['FTP_PASSWORD'].strip()
          base=os.environ.get('FTP_SERVER_DIR','').strip()
          ftp=ftplib.FTP_TLS()
          ftp.connect(server,21,timeout=60)
          ftp.login(user,password)
          ftp.prot_p()
          def ensure(path):
              if path.startswith('/'):
                  ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)
          ensure(base)
          root=ftp.pwd()
          for local in ('rank/lib/rating.php','rank/recalculate.php'):
              ftp.cwd(root)
              ensure(posixpath.dirname(local))
              with open(local,'rb') as f:
                  ftp.storbinary('STOR '+posixpath.basename(local),f)
          ftp.quit()
      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-deploy-renjunet-1900.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/temp-deploy-renjunet-1900.yml
          git commit -m 'Remove temporary RenjuNet deploy helper'
          git push origin HEAD:main
