name: One-time patch tournament 66 Shi Xiaolin

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-tour66-shi.yml'

permissions:
  contents: read

jobs:
  patch:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Patch tournament 66 and player mapping
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          RENJUNET_SITE_URL: https://587.renju.org.tw
        run: python scripts/patch_tour66_shi.py
