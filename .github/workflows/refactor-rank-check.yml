name: Temporary rank refactor check

on:
  push:
    branches: [refactor-rank-admin-ui-20260827]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            rank/index.php \
            rank/paged.php \
            rank/renjunet-elo.php \
            rank/renjunet-elo-embed.php \
            rank/swiss.php \
            rank/swiss-admin-ui.php \
            rank/swiss-table-render.php; do
            php -l "$f"
          done
      - name: JavaScript syntax
        shell: bash
        run: |
          node --check rank/pagination.js
          node --check rank/swiss-admin-ui.js
      - name: Existing project checks
        shell: pwsh
        run: ./scripts/check-project.ps1
