name: Sync RenjuNet database

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renjunet-database-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download current RenjuNet RIF
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 5 --retry-delay 3 \
            -A 'Mozilla/5.0 RenjuNet-RIF-sync' \
            'https://www.renju.net/game/download/xml/' \
            -o /tmp/renjunet.rif
          test -s /tmp/renjunet.rif
          ls -lh /tmp/renjunet.rif
          sha256sum /tmp/renjunet.rif

      - name: Validate Python importer
        shell: bash
        run: python -m py_compile scripts/renjunet_sync.py

      - name: Sync and validate RenjuNet tables
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          RENJUNET_RIF: /tmp/renjunet.rif
          RENJUNET_SITE_URL: https://587.renju.org.tw
        run: python scripts/renjunet_sync.py
