name: Redirect ko1 vcfmenu once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/redirect-ko1-vcfmenu-once.yml'

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  redirect:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Replace vcfmenu.php with permanent redirect
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          import ftplib, io, os
          def clean(v): return (v or '').strip('\r\n ').strip()
          ftp=ftplib.FTP_TLS(); ftp.connect(clean(os.environ['FTP_SERVER']),21,timeout=60)
          ftp.login(clean(os.environ['FTP_USERNAME']),clean(os.environ['FTP_PASSWORD'])); ftp.prot_p()
          base=clean(os.environ.get('FTP_SERVER_DIR','')).replace('\\','/')
          if base.startswith('/'): ftp.cwd('/')
          for part in base.strip('/').split('/'):
              if part: ftp.cwd(part)
          root=ftp.pwd()
          target=root+'/ko1test/vcfmenu.php'
          php="<?php\nheader('Location: https://ko1.renju.org.tw/', true, 301);\nexit;\n"
          ftp.storbinary('STOR '+target, io.BytesIO(php.encode('utf-8')))
          ftp.quit()

      - name: Verify redirect
        shell: bash
        run: |
          set -euo pipefail
          headers="$(curl -k -sS -I --max-time 30 'https://587.renju.org.tw/ko1test/vcfmenu.php')"
          printf '%s\n' "$headers"
          printf '%s\n' "$headers" | grep -Eq '^HTTP/.* 301'
          printf '%s\n' "$headers" | grep -Eiq '^location: https://ko1\.renju\.org\.tw/?\r?$'
