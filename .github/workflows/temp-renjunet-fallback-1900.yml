name: Temp RenjuNet fallback 1900

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-renjunet-fallback-1900.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch Taiwan rating fallback
        shell: python
        run: |
          from pathlib import Path

          path = Path('rank/lib/rating.php')
          text = path.read_text(encoding='utf-8')

          old1 = '''                if ($ratingDate === null) {
                    $warnings[] = "賽號 {$tourId} 外部棋士 {$playerId} 無比賽日期，無法取得 RenjuNet Elo；暫用 GAME 保存分數";
                    $startRating = ($savedStart !== null && $savedStart >= 1000) ? $savedStart : (float)RN_ELO_INITIAL_RATING;
                    $ratingSource = ($savedStart !== null && $savedStart >= 1000) ? 'game_saved_fallback' : 'renjunet_initial_fallback';
                } elseif ($renjuNetPlayerId === null || $renjuNetPlayerId <= 0) {
                    $warnings[] = "賽號 {$tourId} 外部棋士 {$playerId} 找不到 PLAYER_RENJUNET／RIF 對應，無法取得 RenjuNet Elo；暫用 GAME 保存分數";
                    $startRating = ($savedStart !== null && $savedStart >= 1000) ? $savedStart : (float)RN_ELO_INITIAL_RATING;
                    $ratingSource = ($savedStart !== null && $savedStart >= 1000) ? 'game_saved_fallback' : 'renjunet_initial_fallback';
                } else {'''
          new1 = '''                if ($ratingDate === null) {
                    $warnings[] = "賽號 {$tourId} 外部棋士 {$playerId} 無比賽日期，改用 RenjuNet 初始分 " . RN_ELO_INITIAL_RATING;
                    $startRating = (float)RN_ELO_INITIAL_RATING;
                    $ratingSource = 'renjunet_initial';
                } elseif ($renjuNetPlayerId === null || $renjuNetPlayerId <= 0) {
                    // RenjuNet 沒有此棋士／賽事歷史時，視為尚未建立世界等級分的新人。
                    $startRating = (float)RN_ELO_INITIAL_RATING;
                    $ratingSource = 'renjunet_initial';
                } else {'''
          if old1 not in text:
              raise SystemExit('rating fallback block not found')
          text = text.replace(old1, new1, 1)
          path.write_text(text, encoding='utf-8')

          page = Path('rank/recalculate.php')
          if page.exists():
              s = page.read_text(encoding='utf-8')
              s = s.replace(
                  'PLAYER.顯示=1 延續前次重算績分，其他棋士每場使用 GAME 已保存的歷史外部 Elo。',
                  'PLAYER.顯示=1 延續前次重算績分；國家非台灣且顯示=0 的外部棋士使用比賽開始日前的 RenjuNet Elo，若 RenjuNet 尚無可用歷史資料則以 1900 作為新人初始分。'
              )
              page.write_text(s, encoding='utf-8')

      - name: Remove temporary workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/temp-renjunet-fallback-1900.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rank/lib/rating.php rank/recalculate.php .github/workflows/temp-renjunet-fallback-1900.yml
          git commit -m 'Use 1900 for external players without RenjuNet history'
          git push origin HEAD:main
