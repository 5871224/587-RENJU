name: Temp set foreign fallback 1900
on:
  push:
    paths:
      - '.github/workflows/temp-set-foreign-fallback-1900.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch foreign fallback
        run: python3 scripts/temp_patch_1900.py
      - name: Validate
        run: |
          php -l rank/lib/rating.php
          php -l rank/rating-review.php
          pwsh ./scripts/check-project.ps1
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rank/lib/rating.php rank/rating-review.php
          git commit -m 'Use 1900 for missing foreign RenjuNet Elo' || true
          git push
