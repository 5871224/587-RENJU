name: Patch RenjuNet empty strings once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-renjunet-empty-string-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - shell: python
        run: |
          from pathlib import Path
          p=Path('scripts/renjunet_sync.py')
          s=p.read_text(encoding='utf-8')
          old='''def qstr(value):\n    if value is None: return "NULL"\n    return "CONVERT(0x" + str(value).encode("utf-8").hex() + " USING utf8mb4)"\n'''
          new='''def qstr(value):\n    if value is None: return "NULL"\n    raw=str(value).encode("utf-8")\n    if not raw: return "''"\n    return "CONVERT(0x" + raw.hex() + " USING utf8mb4)"\n'''
          if old not in s:
              raise SystemExit('Expected qstr block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')
      - shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/renjunet_sync.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/renjunet_sync.py
          git commit -m 'Handle empty strings in RenjuNet import'
          git push
