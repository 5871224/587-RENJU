name: Temp finish rating review integration
on:
  push:
    paths: ['.github/workflows/temp-deploy-rating-review-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update integrated page protection and project checks
        shell: python
        run: |
          from pathlib import Path

          p=Path('rank/rating-review.php')
          s=p.read_text(encoding='utf-8')
          old="<?php\nrequire_once __DIR__ . '/lib/rating.php';"
          new="<?php\nif (!isset($MYSQL)) require_once __DIR__ . '/login.php';\nif (!function_exists('h')) { function h($value): string { return htmlspecialchars((string)$value, ENT_QUOTES, 'UTF-8'); } }\nrequire_once __DIR__ . '/lib/rating.php';"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('rank/recalculated-ranking.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=history"','href="./?view=rating-tools&amp;tool=review&amp;section=history"')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=check"','href="./?view=rating-tools&amp;tool=review&amp;section=check"')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/check-project.ps1')
          s=p.read_text(encoding='utf-8')
          old="""$rankProtectedPages = @(
              'rank/index.php',
              'rank/recalculate.php',
              'rank/recalculate-check.php',
              'rank/recalculate-export.php',
              'rank/recalculated-ranking.php',
              'rank/final-diff.php',
              'rank/elo-audit.php'
          )"""
          new="""$rankProtectedPages = @(
              'rank/index.php',
              'rank/rating-review.php',
              'rank/recalculate-export.php',
              'rank/recalculated-ranking.php',
              'rank/elo-audit.php'
          )"""
          if old not in s: raise SystemExit('rankProtectedPages block not found')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          p=Path('.github/workflows/deploy.yml')
          s=p.read_text(encoding='utf-8')
          needle="""              'rank/index.php',
              'rank/swiss.php',"""
          replacement="""              'rank/index.php',
              'rank/rating-review.php',
              'rank/recalculated-ranking.php',
              'rank/swiss.php',"""
          if needle not in s: raise SystemExit('forced_files insertion point not found')
          s=s.replace(needle,replacement,1)
          needle="""          for local_path in files:
            remote_path=local_path.replace('\\\\','/'); ftp.cwd(base_dir); ensure_dir(posixpath.dirname(remote_path))
            with open(local_path,'rb') as fh: ftp.storbinary(f'STOR {posixpath.basename(remote_path)}',fh)
          ftp.quit()"""
          replacement="""          for local_path in files:
            remote_path=local_path.replace('\\\\','/'); ftp.cwd(base_dir); ensure_dir(posixpath.dirname(remote_path))
            with open(local_path,'rb') as fh: ftp.storbinary(f'STOR {posixpath.basename(remote_path)}',fh)
          # Legacy rating comparison pages were merged into rank/rating-review.php.
          ftp.cwd(base_dir); ensure_dir('rank')
          for legacy_name in ('recalculate.php','recalculate-check.php','final-diff.php'):
            try: ftp.delete(legacy_name)
            except ftplib.error_perm as exc:
              if not str(exc).startswith('550'): raise
          ftp.quit()"""
          if needle not in s: raise SystemExit('deploy upload block not found')
          p.write_text(s.replace(needle,replacement,1),encoding='utf-8')
      - name: Validate full project
        shell: pwsh
        run: ./scripts/check-project.ps1
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rank/rating-review.php rank/recalculated-ranking.php scripts/check-project.ps1 .github/workflows/deploy.yml
          git commit -m 'Finish integrated rating review checks' || true
          git push
