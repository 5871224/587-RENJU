name: Temp patch integrated rating review
on:
  push:
    paths: ['.github/workflows/temp-deploy-rating-review-cleanup.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch integrated files
        shell: python
        run: |
          from pathlib import Path
          p=Path('rank/rating-review.php')
          s=p.read_text(encoding='utf-8')
          old="<?php\nrequire_once __DIR__ . '/lib/rating.php';"
          new="<?php\nif (!isset($MYSQL)) require_once __DIR__ . '/login.php';\nif (!function_exists('h')) { function h($value): string { return htmlspecialchars((string)$value, ENT_QUOTES, 'UTF-8'); } }\nrequire_once __DIR__ . '/lib/rating.php';"
          if old in s: s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('rank/recalculated-ranking.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=history"','href="./?view=rating-tools&amp;tool=review&amp;section=history"')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=check"','href="./?view=rating-tools&amp;tool=review&amp;section=check"')
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/check-project.ps1')
          s=p.read_text(encoding='utf-8')
          needle="    'rank/index.php',\n    'rank/recalculate-export.php',"
          replacement="    'rank/index.php',\n    'rank/rating-review.php',\n    'rank/recalculate-export.php',"
          if needle not in s: raise SystemExit('security check insertion point not found')
          p.write_text(s.replace(needle,replacement,1),encoding='utf-8')
      - name: Validate full project
        shell: pwsh
        run: ./scripts/check-project.ps1
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rank/rating-review.php rank/recalculated-ranking.php scripts/check-project.ps1
          git commit -m 'Protect and finish integrated rating review' || true
          git push
