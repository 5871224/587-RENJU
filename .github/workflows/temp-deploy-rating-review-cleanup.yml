name: Temp deploy rating review cleanup
on:
  push:
    paths: ['.github/workflows/temp-deploy-rating-review-cleanup.yml']
permissions:
  contents: write
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix integrated links and validate
        shell: python
        run: |
          from pathlib import Path
          p=Path('rank/recalculated-ranking.php')
          s=p.read_text(encoding='utf-8')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=history"','href="./?view=rating-tools&amp;tool=review&amp;section=history"')
          s=s.replace('href="?view=rating-tools&amp;tool=review&amp;section=check"','href="./?view=rating-tools&amp;tool=review&amp;section=check"')
          p.write_text(s,encoding='utf-8')
      - name: PHP syntax check
        run: |
          php -l rank/index.php
          php -l rank/rating-review.php
          php -l rank/recalculated-ranking.php
      - name: Upload integrated files and remove legacy pages
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          import ftplib,os,posixpath
          def clean(v): return v.strip('\r\n')
          ftp=ftplib.FTP_TLS(); ftp.connect(clean(os.environ['FTP_SERVER']),21,timeout=60); ftp.login(clean(os.environ['FTP_USERNAME']),clean(os.environ['FTP_PASSWORD'])); ftp.prot_p()
          server_dir=clean(os.environ.get('FTP_SERVER_DIR','')).strip()
          def ensure(path):
            path=path.replace('\\','/').strip()
            if not path or path=='.': return
            if path.startswith('/'): ftp.cwd('/')
            for part in path.strip('/').split('/'):
              if not part: continue
              try: ftp.cwd(part)
              except ftplib.error_perm: ftp.mkd(part); ftp.cwd(part)
          ensure(server_dir); base=ftp.pwd()
          for local in ['rank/index.php','rank/rating-review.php','rank/recalculated-ranking.php']:
            remote=local.replace('\\','/'); ftp.cwd(base); ensure(posixpath.dirname(remote))
            with open(local,'rb') as fh: ftp.storbinary('STOR '+posixpath.basename(remote),fh)
            print('uploaded',remote)
          ftp.cwd(base); ensure('rank')
          for name in ['recalculate.php','recalculate-check.php','final-diff.php']:
            try:
              ftp.delete(name); print('deleted',name)
            except ftplib.error_perm as e:
              if not str(e).startswith('550'): raise
              print('already absent',name)
          ftp.quit()
      - name: Commit link fix and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-deploy-rating-review-cleanup.yml
          git add rank/recalculated-ranking.php
          git commit -m 'Finish integrated rating review deployment' || true
          git push
