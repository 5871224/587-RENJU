name: Verify BD API once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-bd-api-once.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify production API and frontend paths
        shell: python
        run: |
          import urllib.request
          urls = {
              'config': 'https://587.renju.org.tw/BD/api/yxdb.php?action=public_config',
              'login': 'https://587.renju.org.tw/BD/api/google-login.php',
              'cloud': 'https://587.renju.org.tw/BD/rapfi/vcf-lz4-cloud.js',
              'auth': 'https://587.renju.org.tw/BD/rapfi/vcf-google-popup-auth.js',
              'index': 'https://587.renju.org.tw/BD/',
          }
          data={}
          for key,url in urls.items():
              with urllib.request.urlopen(url, timeout=30) as r:
                  data[key]=(r.status,r.read().decode('utf-8','replace'))
                  print(key,r.status)
          assert data['config'][0] == 200 and '"ok":true' in data['config'][1]
          assert data['login'][0] == 200
          assert 'const API_URL = "api/yxdb.php";' in data['cloud'][1]
          assert 'const LOGIN_URL = "api/google-login.php";' in data['auth'][1]
          assert '20260914-bd-api' in data['index'][1]
