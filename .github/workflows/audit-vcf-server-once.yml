name: Audit VCF server paths once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-vcf-server-once.yml'

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Inspect VCF paths and stale RenjuNet bridges
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          import ftplib, os, posixpath, re
          from datetime import datetime, timezone

          def clean(value):
              return (value or '').strip('\r\n ').strip()

          ftp = ftplib.FTP_TLS()
          ftp.connect(clean(os.environ['FTP_SERVER']), 21, timeout=60)
          ftp.login(clean(os.environ['FTP_USERNAME']), clean(os.environ['FTP_PASSWORD']))
          ftp.prot_p()

          def ensure_dir(path):
              path = clean(path).replace('\\', '/')
              if not path or path == '.':
                  return
              if path.startswith('/'):
                  ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  if part:
                      ftp.cwd(part)

          ensure_dir(os.environ.get('FTP_SERVER_DIR', ''))
          root = ftp.pwd()
          print('SERVER_ROOT', root)

          def mdtm(name):
              try:
                  raw = ftp.sendcmd('MDTM ' + name).split()[-1]
                  return datetime.strptime(raw[:14], '%Y%m%d%H%M%S').replace(tzinfo=timezone.utc)
              except Exception:
                  return None

          print('\nROOT rn_sync files:')
          ftp.cwd(root)
          now = datetime.now(timezone.utc)
          try:
              names = ftp.nlst()
          except Exception:
              names = []
          found = False
          for name in sorted(names):
              base = posixpath.basename(name.rstrip('/'))
              if re.fullmatch(r'rn_sync_[0-9a-fA-F]+\.php', base):
                  found = True
                  modified = mdtm(base)
                  age = ((now - modified).total_seconds() / 3600) if modified else None
                  try: size = ftp.size(base)
                  except Exception: size = None
                  print(f'{base}\tsize={size}\tmodified={modified}\tage_hours={age}')
          if not found:
              print('(none)')

          def list_tree(dirname, max_depth=4):
              print(f'\nTREE {dirname}/:')
              ftp.cwd(root)
              try:
                  ftp.cwd(dirname)
              except ftplib.error_perm as exc:
                  print('MISSING', exc)
                  return
              start = ftp.pwd()
              seen = set()

              def walk(path, rel, depth):
                  if depth > max_depth:
                      return
                  ftp.cwd(path)
                  current = ftp.pwd()
                  try:
                      entries = list(ftp.mlsd())
                  except Exception:
                      entries = []
                      for n in ftp.nlst():
                          b = posixpath.basename(n.rstrip('/'))
                          if b in ('.','..'):
                              continue
                          entries.append((b, {}))
                  for name, facts in sorted(entries, key=lambda x: x[0].lower()):
                      if name in ('.','..'):
                          continue
                      key = current + '/' + name
                      if key in seen:
                          continue
                      seen.add(key)
                      child_rel = f'{rel}/{name}' if rel else name
                      typ = facts.get('type','')
                      if typ == 'dir':
                          print('DIR ', child_rel + '/')
                          if depth < max_depth:
                              walk(current + '/' + name, child_rel, depth + 1)
                              ftp.cwd(current)
                      else:
                          size = facts.get('size')
                          modify = facts.get('modify')
                          if not size:
                              try: size = ftp.size(name)
                              except Exception: size = '?'
                          print(f'FILE {child_rel}\tsize={size}\tmodify={modify or "?"}')
              walk(start, '', 0)

          list_tree('VCF')
          list_tree('vcf')
          ftp.quit()
