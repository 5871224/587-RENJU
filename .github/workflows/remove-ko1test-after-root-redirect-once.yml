name: Remove ko1test after root redirect once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/remove-ko1test-after-root-redirect-once.yml'

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Verify root redirect before deletion
        shell: bash
        run: |
          set -euo pipefail
          check_redirect() {
            url="$1"
            headers="$(curl -k -sS -D - -o /dev/null --max-time 30 "$url" | tr -d '\r')"
            status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}')"
            echo "$url -> $status $location"
            test "$status" = "301"
            test "$location" = "https://ko1.renju.org.tw/"
          }
          check_redirect 'https://587.renju.org.tw/ko1test/'
          check_redirect 'https://587.renju.org.tw/ko1test/vcfmenu.php'
          check_redirect 'https://587.renju.org.tw/ko1test/legacy/path.php?x=1'

      - name: Remove ko1test directory recursively
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
        run: |
          import ftplib, os

          def clean(v):
              return (v or '').strip('\r\n ').strip()

          ftp = ftplib.FTP_TLS()
          ftp.connect(clean(os.environ['FTP_SERVER']), 21, timeout=60)
          ftp.login(clean(os.environ['FTP_USERNAME']), clean(os.environ['FTP_PASSWORD']))
          ftp.prot_p()

          base = clean(os.environ.get('FTP_SERVER_DIR', '')).replace('\\', '/')
          if base.startswith('/'):
              ftp.cwd('/')
          for part in base.strip('/').split('/'):
              if part:
                  ftp.cwd(part)
          root = ftp.pwd().rstrip('/')
          target = root + '/ko1test'
          if not target.endswith('/ko1test'):
              raise RuntimeError('unsafe target: ' + target)

          def exists(path):
              try:
                  ftp.cwd(path)
                  ftp.cwd(root)
                  return True
              except ftplib.error_perm:
                  ftp.cwd(root)
                  return False

          def remove_tree(path):
              rows = list(ftp.mlsd(path))
              for name, facts in rows:
                  if name in ('.', '..'):
                      continue
                  child = path.rstrip('/') + '/' + name
                  if (facts or {}).get('type') == 'dir':
                      remove_tree(child)
                  else:
                      print('delete file', child)
                      ftp.delete(child)
              print('remove dir', path)
              ftp.rmd(path)

          if exists(target):
              remove_tree(target)
          else:
              print('ko1test already absent')
          ftp.quit()

      - name: Verify redirect after deletion
        shell: bash
        run: |
          set -euo pipefail
          for url in \
            'https://587.renju.org.tw/ko1test/' \
            'https://587.renju.org.tw/ko1test/vcfmenu.php' \
            'https://587.renju.org.tw/ko1test/legacy/path.php?x=1'
          do
            headers="$(curl -k -sS -D - -o /dev/null --max-time 30 "$url" | tr -d '\r')"
            status="$(printf '%s\n' "$headers" | awk 'NR==1 {print $2}')"
            location="$(printf '%s\n' "$headers" | awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/, ""); print; exit}')"
            echo "$url -> $status $location"
            test "$status" = "301"
            test "$location" = "https://ko1.renju.org.tw/"
          done
