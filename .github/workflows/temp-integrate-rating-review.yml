name: Temp integrate rating review
on:
  push:
    paths: ['.github/workflows/temp-integrate-rating-review.yml']
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate rating tools
        shell: python
        run: |
          from pathlib import Path
          p=Path('rank/index.php')
          s=p.read_text(encoding='utf-8')
          old="""$ratingTools = [
              'recalculate' => ['title' => '歷史重算比較', 'file' => 'recalculate.php', 'desc' => '依目前 TOURNAMENT、GAME、PLAYER 重新計算並與舊 RANK 比較'],
              'renjunet' => ['title' => 'RenjuNet Elo 重算', 'file' => 'renjunet-elo.php', 'desc' => '只計 rated=1 的 RenjuNet 比賽，所有棋手以 1850 為初始分完整重算歷史 Elo'],
              'latest' => ['title' => '重算後最新排名', 'file' => 'recalculated-ranking.php', 'desc' => '查看由歷史資料重新計算後的最新棋士排名'],
              'check' => ['title' => '重算完整性檢查', 'file' => 'recalculate-check.php', 'desc' => '檢查重算鏈條、局數守恆與外部 Elo 來源'],
              'final-diff' => ['title' => '最終差異比較', 'file' => 'final-diff.php', 'desc' => '比較每位顯示棋士重算後最後績分與舊 RANK 最後績分'],
              'elo-audit' => ['title' => '舊世界 Elo 盤點', 'file' => 'elo-audit.php', 'desc' => '盤點國外棋士 GAME.P1分／P2分 是否保存歷史 Elo'],
          ];"""
          new="""$ratingTools = [
              'review' => ['title' => '台灣排名重算檢查', 'file' => 'rating-review.php', 'desc' => '整合逐場差異、完整性檢查與每位棋士最終差異，所有明細皆可分頁查看'],
              'renjunet' => ['title' => 'RenjuNet Elo 重算', 'file' => 'renjunet-elo.php', 'desc' => '依官方歷史 Rating List 與舊 RIF 規則重建 RenjuNet 歷史 Elo'],
              'latest' => ['title' => '重算後最新排名', 'file' => 'recalculated-ranking.php', 'desc' => '查看由歷史資料重新計算後的最新棋士排名'],
              'elo-audit' => ['title' => '舊世界 Elo 盤點', 'file' => 'elo-audit.php', 'desc' => '盤點國外棋士 GAME.P1分／P2分 是否保存歷史 Elo'],
          ];"""
          if old not in s: raise SystemExit('ratingTools block not found')
          s=s.replace(old,new,1)
          old="""$tool = trim((string)($_GET['tool'] ?? 'recalculate'));
          if (!isset($ratingTools[$tool])) $tool = 'recalculate';"""
          new="""$tool = trim((string)($_GET['tool'] ?? 'review'));
          $legacyRatingTools = ['recalculate' => 'history', 'check' => 'check', 'final-diff' => 'final'];
          if (isset($legacyRatingTools[$tool])) {
              if (!isset($_GET['section'])) $_GET['section'] = $legacyRatingTools[$tool];
              $tool = 'review';
          }
          if (!isset($ratingTools[$tool])) $tool = 'review';"""
          if old not in s: raise SystemExit('tool default block not found')
          s=s.replace(old,new,1)
          s=s.replace('// 工具頁本身不需要額外查詢；內容由同網域既有工具頁嵌入。','// 等級分工具內容在下方直接整合；只有尚未整合的工具暫時保留舊頁。',1)
          old='<iframe class="tool-frame" src="<?= h($ratingTools[$tool][\'file\']) ?>" title="<?= h($ratingTools[$tool][\'title\']) ?>" onload="integrateToolFrame(this)"></iframe>'
          new="""<?php if ($tool === 'review'): ?>
              <?php require __DIR__ . '/rating-review.php'; ?>
          <?php else: ?>
              <iframe class="tool-frame" src="<?= h($ratingTools[$tool]['file']) ?>" title="<?= h($ratingTools[$tool]['title']) ?>" onload="integrateToolFrame(this)"></iframe>
          <?php endif; ?>"""
          if old not in s: raise SystemExit('iframe line not found')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('rank/recalculated-ranking.php')
          rs=q.read_text(encoding='utf-8')
          rs=rs.replace('href="recalculate.php">歷史重算比較</a>','href="?view=rating-tools&amp;tool=review&amp;section=history">歷史重算比較</a>')
          rs=rs.replace('href="recalculate-check.php">完整性檢查</a>','href="?view=rating-tools&amp;tool=review&amp;section=check">完整性檢查</a>')
          q.write_text(rs,encoding='utf-8')

          for oldfile in ['rank/recalculate.php','rank/recalculate-check.php','rank/final-diff.php']:
              Path(oldfile).unlink(missing_ok=True)
      - name: Validate PHP
        run: |
          php -l rank/index.php
          php -l rank/rating-review.php
          php -l rank/recalculated-ranking.php
      - name: Commit integration and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/temp-integrate-rating-review.yml
          git add -A
          git commit -m 'Integrate Taiwan rating comparison tools' || true
          git push
