name: Sync VCF Pages to BD1

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-vcf-bd.yml'

permissions:
  contents: read

concurrency:
  group: production-website
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check whether BD1 needs the latest successful VCF Pages build
        id: version
        shell: bash
        run: |
          set -euo pipefail
          status_file="$(mktemp)"
          curl -fsSL --retry 3 \
            'https://raw.githubusercontent.com/5871224/VCF/deployment-status/status.json' \
            -o "$status_file"

          pages_status="$(jq -r '.status // empty' "$status_file")"
          pages_sha="$(jq -r '.head_sha // empty' "$status_file")"
          pages_run_id="$(jq -r '.run_id // empty' "$status_file")"
          if [ "$pages_status" != 'success' ] || ! [[ "$pages_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Latest VCF Pages deployment is not a valid successful build." >&2
            cat "$status_file" >&2
            exit 1
          fi

          deployed_sha=''
          remote_status="$(mktemp)"
          if curl -k -fsSL --retry 2 \
              -H 'Cache-Control: no-cache' \
              "https://587.renju.org.tw/BD1/deployment.json?check=${pages_sha}" \
              -o "$remote_status"; then
            deployed_sha="$(jq -r '.revision // empty' "$remote_status" 2>/dev/null || true)"
          fi

          echo "pages_sha=$pages_sha" >> "$GITHUB_OUTPUT"
          echo "pages_run_id=$pages_run_id" >> "$GITHUB_OUTPUT"
          if [ "$deployed_sha" = "$pages_sha" ]; then
            echo "needs_sync=false" >> "$GITHUB_OUTPUT"
            echo "BD1 already matches successful VCF Pages build $pages_sha"
          else
            echo "needs_sync=true" >> "$GITHUB_OUTPUT"
            echo "BD1 needs sync: deployed=${deployed_sha:-none}, pages=$pages_sha"
          fi

      - name: Restore Emscripten SDK cache for BD1 YXDB build
        if: steps.version.outputs.needs_sync == 'true'
        uses: actions/cache@v4
        with:
          path: .emsdk
          key: bd1-emsdk-${{ runner.os }}-3.1.74-v1

      - name: Prepare the exact successful VCF Pages source
        if: steps.version.outputs.needs_sync == 'true'
        shell: bash
        env:
          VCF_SHA: ${{ steps.version.outputs.pages_sha }}
        run: |
          set -euxo pipefail
          mkdir vcf
          cd vcf
          git init
          git remote add origin https://github.com/5871224/VCF.git
          git fetch --depth 1 origin "$VCF_SHA"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$VCF_SHA"

          mkdir -p \
            .cache/rapfi-wasm \
            .cache/vcf-pattern-engine \
            .cache/vcf-bitboard-engine \
            .cache/vcf-yxdb-index

          base='https://5871224.github.io/VCF/rapfi/engine'
          curl -fL --retry 3 "$base/rapfi-single-simd128.js?v=$VCF_SHA"   -o .cache/rapfi-wasm/rapfi-single-simd128.js
          curl -fL --retry 3 "$base/rapfi-single-simd128.wasm?v=$VCF_SHA" -o .cache/rapfi-wasm/rapfi-single-simd128.wasm
          curl -fL --retry 3 "$base/rapfi-single-simd128.data?v=$VCF_SHA" -o .cache/rapfi-wasm/rapfi-single-simd128.data
          curl -fL --retry 3 "$base/vcf-pattern-engine.js?v=$VCF_SHA"     -o .cache/vcf-pattern-engine/vcf-pattern-engine.js
          curl -fL --retry 3 "$base/vcf-pattern-engine.wasm?v=$VCF_SHA"   -o .cache/vcf-pattern-engine/vcf-pattern-engine.wasm
          curl -fL --retry 3 "$base/vcf-bitboard-engine.js?v=$VCF_SHA"    -o .cache/vcf-bitboard-engine/vcf-bitboard-engine.js
          curl -fL --retry 3 "$base/vcf-bitboard-engine.wasm?v=$VCF_SHA"  -o .cache/vcf-bitboard-engine/vcf-bitboard-engine.wasm

          emsdk_dir="$GITHUB_WORKSPACE/.emsdk"
          if [ ! -x "$emsdk_dir/upstream/emscripten/em++" ]; then
            rm -rf "$emsdk_dir"
            git clone --depth 1 --branch 3.1.74 https://github.com/emscripten-core/emsdk.git "$emsdk_dir"
            "$emsdk_dir/emsdk" install 3.1.74
            "$emsdk_dir/emsdk" activate 3.1.74
          fi
          source "$emsdk_dir/emsdk_env.sh"
          g++ rapfi/vcf-yxdb-index.cpp -O3 -flto -DNDEBUG -std=c++17 -DVCF_YXDB_INDEX_TEST_MAIN -o /tmp/vcf-yxdb-index-test
          /tmp/vcf-yxdb-index-test
          em++ rapfi/vcf-yxdb-index.cpp \
            -O3 -flto -DNDEBUG -std=c++17 --no-entry \
            -s WASM=1 -s MODULARIZE=1 -s EXPORT_NAME=VCFYxdbIndexModule \
            -s ENVIRONMENT='web,worker,node' -s FILESYSTEM=0 -s ALLOW_MEMORY_GROWTH=1 \
            -s "EXPORTED_FUNCTIONS=['_vcfYxdbLoadFrame','_vcfYxdbQueryKey','_vcfYxdbQueryBoard','_vcfYxdbResultTextPtr','_vcfYxdbResultTextLength','_vcfYxdbQueryKeyPtr','_vcfYxdbQueryKeyLength','_vcfYxdbRecordCount','_vcfYxdbRawSize','_vcfYxdbIndexSlots','_vcfYxdbLastError','_malloc','_free']" \
            -s "EXPORTED_RUNTIME_METHODS=['cwrap']" \
            -o .cache/vcf-yxdb-index/vcf-yxdb-index.js

          node --check rapfi/vcf-bitboard-main.js
          node --check rapfi/vcf-bitboard-worker.js
          node --check rapfi/vcf-shortest-vcf-ui.js
          node tests/workbench-architecture.test.js
          python tools/prepare-pages-site.py
          python tools/prepare-server-site.py \
            --site _site \
            --yxdb-engine-dir .cache/vcf-yxdb-index \
            --api-url /BD/api/yxdb.php \
            --revision "$VCF_SHA"

          test -s _site/index.html
          test -s _site/deployment.json
          test -s _site/rapfi/vcf-bitboard-main.js
          test -s _site/rapfi/vcf-bitboard-worker.js
          test -s _site/rapfi/engine/vcf-bitboard-engine.js
          test -s _site/rapfi/engine/vcf-bitboard-engine.wasm
          test -s _site/rapfi/engine/vcf-yxdb-index.js
          test -s _site/rapfi/engine/vcf-yxdb-index.wasm
          test -s _site/rapfi/vcf-lz4-cloud.js

      - name: Upload VCF server build to BD1
        if: steps.version.outputs.needs_sync == 'true'
        shell: python
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR }}
          VCF_SHA: ${{ steps.version.outputs.pages_sha }}
        run: |
          import ftplib, json, os, posixpath
          from pathlib import Path

          def clean(value):
              return (value or '').strip('\r\n ').strip()

          server = clean(os.environ['FTP_SERVER'])
          username = clean(os.environ['FTP_USERNAME'])
          password = clean(os.environ['FTP_PASSWORD'])
          server_dir = clean(os.environ.get('FTP_SERVER_DIR', ''))
          vcf_sha = clean(os.environ['VCF_SHA'])
          local_root = Path('vcf/_site')
          if not (local_root / 'index.html').is_file():
              raise SystemExit('VCF _site is missing index.html')

          ftp = ftplib.FTP_TLS()
          ftp.connect(server, 21, timeout=60)
          ftp.login(username, password)
          ftp.prot_p()

          def ensure_dir(path):
              path = (path or '').replace('\\', '/').strip()
              if not path or path == '.':
                  return
              if path.startswith('/'):
                  ftp.cwd('/')
              for part in path.strip('/').split('/'):
                  if not part:
                      continue
                  try:
                      ftp.cwd(part)
                  except ftplib.error_perm:
                      ftp.mkd(part)
                      ftp.cwd(part)

          ensure_dir(server_dir)
          ensure_dir('BD1')
          target_dir = ftp.pwd()

          deployment_file = local_root / 'deployment.json'
          deployment = json.loads(deployment_file.read_text(encoding='utf-8'))
          if deployment.get('revision') != vcf_sha or deployment.get('target') != 'BD1':
              raise SystemExit('BD1 deployment.json does not match the requested VCF revision')

          files = sorted(
              path for path in local_root.rglob('*')
              if path.is_file() and path != deployment_file
          )
          print(f'Uploading {len(files)} VCF files to {target_dir}')
          for path in files:
              rel = path.relative_to(local_root).as_posix()
              ftp.cwd(target_dir)
              parent = posixpath.dirname(rel)
              if parent:
                  ensure_dir(parent)
              with path.open('rb') as fh:
                  ftp.storbinary(f'STOR {posixpath.basename(rel)}', fh)

          # Upload deployment.json last. If any file upload above fails, BD1 remains
          # marked as the previous revision and the next scheduled run retries the sync.
          ftp.cwd(target_dir)
          with deployment_file.open('rb') as fh:
              ftp.storbinary('STOR deployment.json', fh)

          ftp.quit()
          print(f'VCF BD1 sync complete: {vcf_sha}')

      - name: Verify BD1 matches the successful Pages build
        if: steps.version.outputs.needs_sync == 'true'
        shell: bash
        env:
          VCF_SHA: ${{ steps.version.outputs.pages_sha }}
        run: |
          set -euo pipefail
          cd vcf

          check_file() {
            rel="$1"
            remote="$(mktemp)"
            curl -k -fLsS --retry 3 \
              -H 'Cache-Control: no-cache' \
              "https://587.renju.org.tw/BD1/$rel?sync_verify=$VCF_SHA" \
              -o "$remote"
            local_sha="$(sha256sum "_site/$rel" | awk '{print $1}')"
            remote_sha="$(sha256sum "$remote" | awk '{print $1}')"
            echo "$rel local=$local_sha remote=$remote_sha"
            test "$local_sha" = "$remote_sha"
            rm -f "$remote"
          }

          check_file index.html
          check_file rapfi/vcf-bitboard-main.js
          check_file rapfi/vcf-bitboard-worker.js
          check_file rapfi/engine/vcf-bitboard-engine.js
          check_file rapfi/engine/vcf-bitboard-engine.wasm
          check_file rapfi/engine/vcf-yxdb-index.js
          check_file rapfi/engine/vcf-yxdb-index.wasm
          check_file rapfi/vcf-lz4-cloud.js

          marker="$(mktemp)"
          curl -k -fLsS --retry 3 \
            -H 'Cache-Control: no-cache' \
            "https://587.renju.org.tw/BD1/deployment.json?sync_verify=$VCF_SHA" \
            -o "$marker"
          test "$(jq -r '.revision' "$marker")" = "$VCF_SHA"
          test "$(jq -r '.target' "$marker")" = 'BD1'
          echo "BD1 verified at VCF Pages SHA $VCF_SHA"
