<h1>《2021棋聖盃全國五子棋公開賽》</h1>
很遺憾地通知大家，因疫情持續擴大，為配合政府防疫建議，減少感染風險，本次比賽，確定停辦。<br>
已繳交報名費之選手或家長，請填寫退費申請表，協會於核對資料後，約三至四週內退費。<br>
退費申請表：<a href="https://reurl.cc/R6p8NZ" target="new">https://reurl.cc/R6p8NZ</a><a href="https://reurl.cc/R6p8NZ"></a><br>

<h2>●組別及資格</h2>

　晉段組：不限年齡自由參加 <br />
　日規組：不限年齡，限棋力６級以下參加<br />
　普規甲組：限國中以下學生，且棋力１０級以下學生參加<br />
　普規乙組：限國小三年級以下學生，且棋力１４級以下學生參加<br>
	 　<a href="http://587.renju.org.tw/riftw/den.php">查看段級位名單</a><br />
<h2>●賽制</h2>
  　皆採五輪瑞士制<br>
　晉段組：採「國際規則」，每輪一盤棋，每方基本時限２０分鐘，每手加１５秒，須自行記譜<br>
　日規組：採「日式規則」，每輪二盤棋，雙方各持黑一盤，每方基本時限８分鐘，每手加１０秒<br />
　普規組：採「普通規則」，每輪二盤棋，雙方各持黑一盤，每輪以３０分鐘為準，裁判依狀況擺放計時鐘限制時間<br />

<h2>●報名方式</h2>
  　１.<span style="color: #FF00FF">報名截止日為２０２１年５月２３日</span>（場地空間有限，額滿即截止報名）<br>
　２.僅接受<a href="https://forms.gle/pUuk3VCLsJJDQ9LF8" target="new">網路報名</a><br />
  　３.報名費：每人４００元<br>
　　請於報名後三日內匯款，中國信託（銀行代碼８２２）基隆分行，帳號：381540356438，戶名：宋佩蓉

<p>  　１.全程參與之比賽選手，均頒發參加獎<br>
  　２.各組冠軍獎金：晉段１０００元，日規８００元，普甲５００元，普乙２００元<br>
  　３.日規及普規各組取前三名，頒發獎盃及獎狀，依各組參賽人數增頒獎牌及獎狀<br>
　４.晉段組取前三名，頒發獎狀，依規定至少需８人參賽，取１人晉升初段（１３人取２名，２１人取３名）<br>
　５.各組五輪合計之總分，依下表認定協會級位（未晉升初段者皆適用），但輪空之得分不計入</p>

<h2>●注意事項</h2>
<p>　１.比賽地點附近停車困難，請儘量搭程大眾運輸工具<br>
  　２.每輪結束時，請「舉手」通知現場工作人員，勿大聲喧嘩<br>
  　３.比賽場內除選手及工作人員，其餘人員不得進入比賽會場<br>
　４.會場內請勿飲食，請自行攜帶茶水，週邊停車不易，請預留時間<br>
　５.選手未於開賽後５分鐘就座，該輪將判定為負<br>
　６.若有某組報名人數未滿６人，將視情況併組<br>
  　７.其餘細則比照一般正式比賽規則，若遇無法處理之情形，由大會裁定<br />
</p>
<h2>●規則　</h2>
普通規則：<br />
　●黑子先下、白子後下，輪流下子<br />
　●先將五顆子連成直線、橫線或斜線者為勝，超過五子（長連）也算獲勝<br />
　●雙方認為無法獲勝時，可協議和局<br />
<br />
日式規則：<br />
　●基本下法和普通規則一樣<br>
　●白棋沒有任何限制，但黑棋禁止下出雙活三，雙四，長連，下出則算輸<br>
　●可以放棄下子（PASS），若雙方都PASS則和棋<br>
　※黑棋下出五同時出現禁手，則不算禁，五最大，判黑勝<br>
<br>
國際規則： <br>
　１.開局方在<a href="../../../open.htm">26開局</a>中選擇一種開局<br>
　２.另一方可選擇持黑棋或白棋<br>
　３.白方下出第四手<br>
　４.黑方提出兩個第五手，但不能同型（不對稱）<br>
　５.白方選擇其中一點當第五手<br>
　開局階段結束，按日式規則繼續進行
