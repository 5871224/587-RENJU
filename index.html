    </div>
  </footer>

  <script>
  (() => {
    'use strict';
    const header = document.getElementById('tra-header');
    const host = document.getElementById('tra-menu-host');
    const toggle = document.getElementById('tra-menu-toggle');
    function closeGroups(except = null) {
      host.querySelectorAll('.menu-group').forEach(group => {
        if (group !== except) {
          group.classList.remove('menu-open');
          const button = group.querySelector('.menu-parent');
          if (button) button.setAttribute('aria-expanded', 'false');
        }
      });
    }
    function closeMobile() {
      header.classList.remove('nav-open');
      toggle.setAttribute('aria-expanded','false');
      toggle.setAttribute('aria-label','展開導覽選單');
      closeGroups();
    }
    toggle.addEventListener('click', () => {
      const next = !header.classList.contains('nav-open');
      header.classList.toggle('nav-open', next);
      toggle.setAttribute('aria-expanded', String(next));
      toggle.setAttribute('aria-label', next ? '收合導覽選單' : '展開導覽選單');
      if (!next) closeGroups();
    });
    document.addEventListener('click', event => { if (!header.contains(event.target)) closeMobile(); });
    document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMobile(); });
    document.getElementById('tra-to-top').addEventListener('click', () => {
      window.scrollTo({ top: 0, behavior: window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
    });
    fetch('menu.html', {cache:'no-cache'})
      .then(response => { if (!response.ok) throw new Error('menu request failed'); return response.text(); })
      .then(html => {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const nav = doc.getElementById('menu');
        if (!nav) throw new Error('menu not found');
        // The preview/official landing page belongs to the Home section.
        nav.querySelector('.menu-main > .menu-group')?.classList.add('is-current');
        const mobileMenu = window.matchMedia('(max-width: 850px)');
        mobileMenu.addEventListener('change', () => closeMobile());
        nav.querySelectorAll('.menu-parent').forEach(button => {
          button.removeAttribute('onclick');
          button.setAttribute('aria-expanded', 'false');
          button.addEventListener('click', event => {
            if (!mobileMenu.matches) {
              // Desktop menus are hover-driven; a mouse click must not pin them open.
              closeGroups();
              if (event.detail !== 0) button.blur();
              return;
            }
            const group = button.closest('.menu-group');
            const next = !group.classList.contains('menu-open');
            closeGroups(group);
            group.classList.toggle('menu-open', next);
            button.setAttribute('aria-expanded', String(next));
          });
        });
        host.replaceChildren(nav);
      })
      .catch(error => {
        console.error('導覽選單載入失敗', error);
        const link = document.createElement('a');
        link.textContent = '網站導覽';
        link.href = 'menu.html';
        link.style.cssText = 'color:#f8f7f1;align-self:center';
        host.replaceChildren(link);
      });
  })();
  </script>
